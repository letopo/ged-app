# Contrôles du serveur à chaque PR (docs/plan-typescript.md, étape 0) :
# vérification des types, compilation src/ → dist/, tests.
name: Serveur — types et tests

on:
  pull_request:
    paths: [ "backend/**", ".github/workflows/backend-ci.yml" ]
  push:
    branches: [ "main" ]
    paths: [ "backend/**" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --check dist/server.js
      - run: npm test
