# Contrôles du serveur à chaque PR (docs/plan-typescript.md) : vérification
# des types, compilation src/ → dist/, tests unitaires et d'intégration (base
# PostgreSQL jetable, structure tirée de tests/fixtures/schema.sql).
name: Serveur — types et tests

on:
  pull_request:
    paths: [ "backend/**", ".github/workflows/backend-ci.yml" ]
  push:
    branches: [ "main" ]
    paths: [ "backend/**" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --check dist/server.js
      - run: npm test
