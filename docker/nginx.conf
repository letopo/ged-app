// backend/src/utils/socketManager.js
import { Server } from 'socket.io';
import jwt from 'jsonwebtoken';

let io = null;
const userSockets = new Map(); // Map<userId, Set<socketId>>

/**
 * Initialise Socket.IO avec le serveur HTTP
 */
export const initializeSocket = (server) => {
  io = new Server(server, {
    // ✅ AJOUT CRITIQUE : Configuration du path et des transports
    path: '/socket.io',
    transports: ['polling', 'websocket'],
    allowUpgrades: true,
    
    cors: {
      origin: [
        'http://localhost',
        'https://localhost',
        'http://localhost:80',
        'https://localhost:80',
        'http://localhost:3001',
        'https://localhost:3001',
        'http://localhost:5173',
        'https://localhost:5173',
        'http://192.168.1.186',
        'https://192.168.1.186',
        process.env.CORS_ORIGIN
      ].filter(Boolean),
      credentials: true,
      methods: ['GET', 'POST']
    },
    
    // ✅ AJOUT : Options supplémentaires pour la stabilité
    pingTimeout: 60000,
    pingInterval: 25000,
    upgradeTimeout: 10000,
    maxHttpBufferSize: 1e6
  });

  // Middleware d'authentification Socket.IO
  io.use((socket, next) => {
    try {
      const token = socket.handshake.auth.token;
      
      if (!token) {
        return next(new Error('Authentication error: No token provided'));
      }

      // Vérifier le token JWT
      const decoded = jwt.verify(token, process.env.JWT_SECRET);
      socket.userId = decoded.id;
      socket.userEmail = decoded.email;
      
      console.log(`✅ Socket authentifié: User ${decoded.id} (${decoded.email})`);
      next();
    } catch (error) {
      console.error('❌ Erreur authentification socket:', error.message);
      next(new Error('Authentication error'));
    }
  });

  io.on('connection', (socket) => {
    const userId = socket.userId;
    
    // Ajouter le socket à la map des utilisateurs
    if (!userSockets.has(userId)) {
      userSockets.set(userId, new Set());
    }
    userSockets.get(userId).add(socket.id);
    
    console.log(`🔌 User ${userId} connecté (Socket: ${socket.id})`);
    console.log(`📊 Total connexions actives: ${io.engine.clientsCount}`);

    // Rejoindre une room personnelle basée sur l'userId
    socket.join(`user:${userId}`);

    // ============================================
    // ✅ NOUVEAUX GESTIONNAIRES POUR TICKETS
    // ============================================
    
    // Rejoindre une file d'attente
    socket.on('join_queue', (queueType) => {
      if (['accueil_php', 'accueil_normal', 'caisse'].includes(queueType)) {
        socket.join(`queue_${queueType}`);
        console.log(`📥 Socket ${socket.id} (User ${userId}) a rejoint queue_${queueType}`);
        
        // Confirmer la connexion
        socket.emit('queue_joined', { 
          queueType, 
          success: true,
          timestamp: new Date()
        });
      } else {
        console.warn(`⚠️ Tentative de rejoindre une queue invalide: ${queueType}`);
        socket.emit('queue_joined', { 
          queueType, 
          success: false,
          error: 'Type de file invalide'
        });
      }
    });

    // Quitter une file d'attente
    socket.on('leave_queue', (queueType) => {
      socket.leave(`queue_${queueType}`);
      console.log(`📤 Socket ${socket.id} (User ${userId}) a quitté queue_${queueType}`);
      
      socket.emit('queue_left', { 
        queueType, 
        success: true,
        timestamp: new Date()
      });
    });

    // Rejoindre une position (pour les agents)
    socket.on('join_position', ({ queueType, positionNumber }) => {
      const roomName = `position_${queueType}_${positionNumber}`;
      socket.join(roomName);
      console.log(`🪑 Socket ${socket.id} (User ${userId}) a rejoint ${roomName}`);
      
      socket.emit('position_joined', {
        queueType,
        positionNumber,
        success: true,
        timestamp: new Date()
      });
    });

    // Quitter une position
    socket.on('leave_position', ({ queueType, positionNumber }) => {
      const roomName = `position_${queueType}_${positionNumber}`;
      socket.leave(roomName);
      console.log(`🚪 Socket ${socket.id} (User ${userId}) a quitté ${roomName}`);
      
      socket.emit('position_left', {
        queueType,
        positionNumber,
        success: true,
        timestamp: new Date()
      });
    });

    // Demander le statut d'une file d'attente
    socket.on('request_queue_status', (queueType) => {
      console.log(`📊 User ${userId} demande le statut de ${queueType}`);
      // Le client recevra une réponse via les événements normaux
      emitQueueUpdate(queueType);
    });

    // ============================================
    // GESTIONNAIRES EXISTANTS
    // ============================================

    // Gérer la déconnexion
    socket.on('disconnect', () => {
      const userSocketSet = userSockets.get(userId);
      if (userSocketSet) {
        userSocketSet.delete(socket.id);
        if (userSocketSet.size === 0) {
          userSockets.delete(userId);
        }
      }
      console.log(`🔌 User ${userId} déconnecté (Socket: ${socket.id})`);
      console.log(`📊 Total connexions actives: ${io.engine.clientsCount}`);
    });

    // Événement de test (optionnel)
    socket.on('ping', () => {
      socket.emit('pong', { timestamp: Date.now() });
    });
  });

  console.log('✅ Socket.IO initialisé avec succès');
  console.log('📡 Path: /socket.io');
  console.log('🚀 Transports: polling, websocket');
  console.log('📡 Rooms disponibles:');
  console.log('   - user:{userId} (rooms personnelles)');
  console.log('   - queue_accueil_php');
  console.log('   - queue_accueil_normal');
  console.log('   - queue_caisse');
  console.log('   - position_{queueType}_{positionNumber}');

  return io;
};

/**
 * Émet une notification de nouvelle tâche à un validateur spécifique
 */
export const emitNewTaskNotification = (validatorId, taskData) => {
  if (!io) {
    console.warn('⚠️ Socket.IO non initialisé');
    return false;
  }

  const notification = {
    type: 'new_task',
    taskId: taskData.taskId,
    documentId: taskData.documentId,
    documentTitle: taskData.documentTitle,
    documentCategory: taskData.documentCategory,
    submittedBy: taskData.submittedBy,
    timestamp: new Date().toISOString(),
    message: `Nouvelle tâche: ${taskData.documentTitle}`
  };

  // Émettre vers la room de l'utilisateur
  io.to(`user:${validatorId}`).emit('task_assigned', notification);
  
  console.log(`🔔 Notification envoyée à User ${validatorId}:`, notification);
  
  return true;
};

/**
 * Émet une notification de mise à jour de tâche
 */
export const emitTaskUpdateNotification = (validatorId, updateData) => {
  if (!io) {
    console.warn('⚠️ Socket.IO non initialisé');
    return false;
  }

  const notification = {
    type: 'task_update',
    taskId: updateData.taskId,
    status: updateData.status,
    timestamp: new Date().toISOString(),
    message: updateData.message
  };

  io.to(`user:${validatorId}`).emit('task_updated', notification);
  
  console.log(`🔔 Mise à jour envoyée à User ${validatorId}:`, notification);
  
  return true;
};

/**
 * Vérifie si un utilisateur est connecté
 */
export const isUserConnected = (userId) => {
  return userSockets.has(userId) && userSockets.get(userId).size > 0;
};

/**
 * Obtient le nombre de connexions actives pour un utilisateur
 */
export const getUserConnectionCount = (userId) => {
  const userSocketSet = userSockets.get(userId);
  return userSocketSet ? userSocketSet.size : 0;
};

/**
 * Obtient les statistiques globales
 */
export const getSocketStats = () => {
  return {
    totalConnections: io ? io.engine.clientsCount : 0,
    uniqueUsers: userSockets.size,
    userSockets: Array.from(userSockets.entries()).map(([userId, sockets]) => ({
      userId,
      connectionCount: sockets.size
    }))
  };
};

export const getIO = () => io;

export default {
  initializeSocket,
  emitNewTaskNotification,
  emitTaskUpdateNotification,
  isUserConnected,
  getUserConnectionCount,
  getSocketStats,
  getIO
};

// ============================================
// ✅ NOUVELLES FONCTIONS POUR TICKETS
// ============================================

/**
 * Émettre la création d'un nouveau ticket
 */
export const emitTicketCreated = (queueType, ticket) => {
  if (!io) {
    console.warn('⚠️ Socket.IO non initialisé');
    return;
  }
  
  console.log(`📢 Émission: ticket_created pour queue ${queueType}`);
  io.to(`queue_${queueType}`).emit('ticket_created', ticket);
};

/**
 * Émettre l'appel d'un ticket
 */
export const emitTicketCalled = (queueType, ticket, positionNumber) => {
  if (!io) {
    console.warn('⚠️ Socket.IO non initialisé');
    return;
  }
  
  console.log(`📢 Émission: ticket_called - ${ticket.ticketNumber} → Position ${positionNumber}`);
  
  // Émettre à toute la salle d'attente
  io.to(`queue_${queueType}`).emit('ticket_called', {
    ticket,
    positionNumber,
    announcement: `${ticket.ticketNumber}, veuillez vous présenter à la position ${positionNumber}`
  });
};

/**
 * Émettre la complétion d'un ticket
 */
export const emitTicketCompleted = (queueType, ticket) => {
  if (!io) {
    console.warn('⚠️ Socket.IO non initialisé');
    return;
  }
  
  console.log(`✅ Émission: ticket_completed - ${ticket.ticketNumber}`);
  io.to(`queue_${queueType}`).emit('ticket_completed', ticket);
};

/**
 * Émettre une mise à jour de la file d'attente
 */
export const emitQueueUpdate = (queueType) => {
  if (!io) {
    console.warn('⚠️ Socket.IO non initialisé');
    return;
  }
  
  console.log(`🔄 Émission: queue_update pour ${queueType}`);
  io.to(`queue_${queueType}`).emit('queue_update', { queueType, timestamp: new Date() });
};

/**
 * Émettre une mise à jour des positions
 */
export const emitPositionUpdate = (queueType, position) => {
  if (!io) {
    console.warn('⚠️ Socket.IO non initialisé');
    return;
  }
  
  console.log(`🔄 Émission: position_update pour ${queueType}`);
  io.to(`queue_${queueType}`).emit('position_update', position);
};