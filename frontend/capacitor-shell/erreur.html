<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GED HSJM — serveur injoignable</title>
<!-- Affichée par l'APK quand le serveur GED ne répond plus en cours d'utilisation. -->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,Roboto,sans-serif;background:#1B3A6B;color:#fff;padding:24px 16px;box-sizing:border-box}
  .carte{max-width:420px;text-align:center}
  h1{font-size:1.3rem;margin:0 0 12px}
  p{opacity:.85;line-height:1.5;margin:0 0 24px}
  button{display:block;width:100%;background:#fff;color:#1B3A6B;border:0;border-radius:10px;padding:14px;font-size:1rem;font-weight:600}
  .lien{background:none;color:#fff;text-decoration:underline;font-weight:400;margin-top:12px}
</style>
</head>
<body>
<div class="carte">
  <h1>Serveur de la GED injoignable</h1>
  <p>Vérifiez que le téléphone est connecté au bon Wi-Fi et que le serveur est démarré, puis réessayez.</p>
  <button onclick="location.replace('/')">Réessayer</button>
  <button class="lien" onclick="location.replace('/?changer=1')">Changer de serveur</button>
</div>
</body>
